server:
  port: 8080

spring:
  application:
    name: ai-recruiter

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_recruiter}
    username: ${SPRING_DATASOURCE_USERNAME:recruiter}
    password: ${SPRING_DATASOURCE_PASSWORD:recruiter_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── File upload limits ────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ── AI Configuration ──────────────────────────────────────
  ai:
    # Ollama — embeddings only
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: nomic-embed-text
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3
          max-tokens: 500

# ── Qdrant Configuration ──────────────────────────────────
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collections:
    resumes: resume-chunks
    jobs: job-descriptions
  vector-size: 768  # nomic-embed-text output dimension

# ── Application Configuration ─────────────────────────────
app:
  default-tenant-id: 00000000-0000-0000-0000-000000000001
  matching:
    vector-weight: 0.40
    structured-weight: 0.40
    recency-weight: 0.10
    location-weight: 0.10

# ── Actuator (Health Checks) ──────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.airecruiter: DEBUG
    org.springframework.ai: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
