server:
  port: 8080

spring:
  application:
    name: ai-recruiter

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_recruiter}
    username: ${SPRING_DATASOURCE_USERNAME:recruiter}
    password: ${SPRING_DATASOURCE_PASSWORD:recruiter_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── File upload limits ────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    # Ollama — embeddings only
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false          # disable Ollama chat
      embedding:
        model: nomic-embed-text

    # Groq — chat/generation only
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:your-groq-key-here}
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.3
          max-tokens: 300
      embedding:
        enabled: false          # disable OpenAI embeddings

# ── Qdrant ───────────────────────────────────────────────────
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collections:
    resumes: resume-chunks        # Collection name for resume embeddings
    jobs: job-descriptions        # Collection name for job embeddings
  vector-size: 768                # nomic-embed-text output dimension

# ── App-specific settings ─────────────────────────────────────
app:
  chat-model-name: llama-3.1-8b-instant-via-groq
  rag:
    top-k: 3                      # How many chunks to retrieve per query
  bias:
    sensitive-fields:             # Fields to strip/mask from AI output
      - gender
      - age
      - ethnicity
      - nationality
  default-tenant-id: 00000000-0000-0000-0000-000000000001

# ── Actuator (health checks) ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.airecruiter: DEBUG
    org.springframework.ai: INFO
