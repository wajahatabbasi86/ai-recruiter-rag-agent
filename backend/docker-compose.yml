services:

  ollama:
    image: ollama/ollama:latest
    container_name: ai-recruiter-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-recruiter-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-recruiter-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-recruiter-net
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  postgres:
    image: postgres:16-alpine
    container_name: ai-recruiter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_recruiter
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: recruiter_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-recruiter-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiter -d ai_recruiter"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-recruiter-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_recruiter
      SPRING_DATASOURCE_USERNAME: recruiter
      SPRING_DATASOURCE_PASSWORD: recruiter_pass
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334        # ← fixed: gRPC port
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - ai-recruiter-net
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:

networks:
  ai-recruiter-net:
    driver: bridge